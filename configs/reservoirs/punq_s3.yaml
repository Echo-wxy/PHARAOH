_base_: _base.yaml
reservoir:
  name: PUNQ-S3
  prefix: PNQ
  grid:
    source: grdecl
    path: data/raw/punq_s3/PUNQS3.DATA
    cell_size_m: {dx: 180.0, dy: 180.0, dz: 5.0}  # approximate average cell size
    top_depth_m: 2330.0
graph:
  regions: {n_regions: 6}
  patterns:
    spacing_m: [360, 540, 720]
  wells:
    placements_per_pattern: 10
  controls:
    inj_rate_m3d: [200, 300, 400, 500]
    prod_bhp_bar: [100, 120, 140, 160]

full_physics:
  simulator: OPM Flow
  model_realization: 0                  # reference ("truth") case
  horizon_years: 16.5
  report_step_days: 30
  water_breakthrough_threshold: 0.05     # water cut at which breakthrough is recorded
  injector_bhp_limit_bar: 320.0
  control_stage_years: [5.5, 5.5, 5.5]
  economics:
    oil_price_usd_bbl: 45.0
    water_handling_usd_bbl: 6.0
    water_injection_usd_bbl: 2.0
    discount_rate: 0.08
    well_cost_model: {fixed_musd_per_well: 10.0, usd_per_meter: 3500.0}
