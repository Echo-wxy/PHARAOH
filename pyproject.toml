[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pharaoh"
version = "0.1.0"
description = "PetroGraph construction, data splits, leakage audit, prompts, and configurations for physics-informed hierarchical retrieval over reservoir development knowledge graphs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "coverage>=7", "ruff>=0.4"]
sim = ["resdata>=4.0"]

[tool.setuptools.packages.find]
include = ["pharaoh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 145

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pharaoh"]
known-local-folder = ["_common"]
